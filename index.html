しょう","にさせる":"にさせる","がするのを手伝う":"がするのをてつだう","にするよう頼む":"にするようたのむ","するように言われる":"するようにいわれる","することを許される":"することをゆるされる","することに興味がある":"することにきょうみがある"};function hira(s){let z=norm(s),ks=Object.keys(READINGS).sort((a,b)=>b.length-a.length);ks.forEach(k=>{z=z.split(k).join(norm(READINGS[k]))});return z.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96))}function norm(s){return s.toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[。、，,.・\s]/g,'').replace(/[～〜]/g,'')}function jpEqual(user,ans){let u=norm(user),a=norm(ans);if(u===a)return true;let hit=false;Object.keys(READINGS).forEach(k=>{let x=norm(k),y=norm(READINGS[k]),p=a.indexOf(x);if(p>=0&&x.length===y.length&&u.length===a.length&&u.slice(0,p)===a.slice(0,p)&&u.slice(p+x.length)===a.slice(p+x.length)&&u.slice(p,p+x.length).split('').every((c,i)=>c===x[i]||c===y[i]))hit=true});return hit||hira(user)===hira(ans)}function isCorrect(user,ans,dir){let u=norm(user);if(!u)return false;if(dir==='ja-en')return u===norm(ans);let raw=ans.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);return raw.some(x=>jpEqual(user,x)||u.length>=2&&(norm(x).includes(u)||u.includes(norm(x))))}function start(review){let a=+$('from').value,b=+$('to').value;if(a<1)a=1;if(b>600)b=600;if(a>b)[a,b]=[b,a];$('from').value=a;$('to').value=b;let kind=$('kind').value,mode=$('studyMode').value;Q=DATA.filter(x=>x.no>=a&&x.no<=b&&(kind==='all'||x.type===kind));if(review)Q=Q.filter(x=>wrongs[key(x)]);if(mode==='due')Q=Q.filter(x=>stats[key(x)]&&stats[key(x)].next<=Date.now());if(mode==='weak')Q.sort((a,b)=>weakScore(b)-weakScore(a));else if($('order').value==='random'||mode==='exam')Q.sort(()=>Math.random()-.5);isExam=mode==='exam';let n=isExam?50:$('count').value;if(n!=='all')Q=Q.slice(0,+n);if(!Q.length){alert(mode==='due'?'現在、復習期限を迎えた問題はありません。':'出題対象がありません。');return}idx=ok=ng=0;examAnswers=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('examBanner').classList.toggle('hidden',!isExam);if(isExam)startTimer();show()}function show(){answered=false;let x=Q[idx],d=$('dir').value;currentDir=d==='mix'?(Math.random()<.5?'en-ja':'ja-en'):d;$('meta').textContent=x.type+' No.'+x.no+' ｜ '+(currentDir==='en-ja'?'英語→日本語':'日本語→英語');$('prompt').textContent=currentDir==='en-ja'?x.en:x.ja;$('ipa').textContent=currentDir==='en-ja'?x.ipa:'';$('userAnswer').value='';$('userAnswer').disabled=false;$('fb').className='feedback';$('fb').innerHTML='';$('judgeBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');update();setTimeout(()=>$('userAnswer').focus(),50)}function judge(forcedWrong=false){if(answered)return;let x=Q[idx],ans=currentDir==='en-ja'?x.ja:x.en,user=$('userAnswer').value,good=!forcedWrong&&isCorrect(user,ans,currentDir);answered=true;recordAttempt(x,good);if(good){ok++;delete wrongs[key(x)]}else{ng++;wrongs[key(x)]={...x,last:new Date().toLocaleDateString('ja-JP'),tries:(wrongs[key(x)]?.tries||0)+1}}examAnswers.push({x,user,ans,good});save();$('fb').className='feedback '+(good?'ok':'ng');$('fb').innerHTML=isExam?'回答を記録しました':(good?'正解！':'不正解')+'<div class="answer">正答：'+esc(ans)+'</div>';$('userAnswer').disabled=true;$('judgeBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=idx===Q.length-1?'結果を見る':'次の問題';update()}function showAnswer(){if(answered)return;let x=Q[idx],ans=currentDir==='en-ja'?x.ja:x.en;$('fb').className='feedback ng';$('fb').innerHTML='正答を表示しました<div class="answer">'+esc(ans)+'</div>';judge(true)}function next(){if(idx<Q.length-1){idx++;show()}else finish()}function finish(){clearInterval(timerId);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let total=ok+ng,rate=total?Math.round(ok/total*100):0;if(isExam){examHistory.unshift({date:new Date().toLocaleString('ja-JP'),ok,total,rate});examHistory=examHistory.slice(0,20);save();let misses=examAnswers.filter(a=>!a.good).map(a=>'<li>'+esc(a.x.en)+'：'+esc(a.ans)+'</li>').join('');$('resultText').innerHTML='<p class="word">'+ok+' / '+total+' 正解</p><p>模試正答率 '+rate+'％</p>'+(misses?'<h3>不正解</h3><ul>'+misses+'</ul>':'<p>全問正解です。</p>')}else $('resultText').innerHTML='<p class="word">'+ok+' / '+total+' 正解</p><p>正答率 '+rate+'％　学習履歴を更新しました。</p>'}function home(){$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('setup').classList.remove('hidden')}function update(){let total=ok+ng;$('progress').textContent=Math.min(idx+1,Q.length)+'/'+Q.length;$('correct').textContent=ok;$('wrong').textContent=ng;$('rate').textContent=(total?Math.round(ok/total*100):0)+'%'}function renderWrongs(){let a=Object.values(wrongs).sort((a,b)=>a.type.localeCompare(b.type,'ja')||a.no-b.no);$('wrongCount').textContent=a.length+'件';$('wrongList').innerHTML=a.length?a.map(x=>'<div class="wrong-item"><div><span>'+esc(x.en)+'</span><div class="small">'+x.type+' No.'+x.no+'｜'+esc(x.ja)+'</div></div><button class="secondary" onclick="removeWrong(&quot;'+key(x)+'&quot;)">削除</button></div>').join(''):'<p class="small">まだ間違い記録はありません。</p>'}function removeWrong(k){delete wrongs[k];save()}function clearWrong(){if(confirm('間違い記録をすべて削除しますか？')){wrongs={};save()}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('userAnswer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answered?next():judge()}});document.addEventListener('keydown',e=>{if(e.code==='Space'&&answered&&!$('quiz').classList.contains('hidden')){e.preventDefault();next()}});function weakScore(x){let z=stats[key(x)];return z?((z.wrong*3)+(1-z.correct/Math.max(1,z.attempts))*5):0}function recordAttempt(x,good){let k=key(x),z=stats[k]||{attempts:0,correct:0,wrong:0,streak:0,interval:0,next:0};z.attempts++;if(good){z.correct++;z.streak++;let seq=[1,3,7,14,30,60];z.interval=seq[Math.min(z.streak-1,seq.length-1)]}else{z.wrong++;z.streak=0;z.interval=1}z.next=Date.now()+z.interval*86400000;z.last=Date.now();stats[k]=z}function level(z){let r=z.correct/Math.max(1,z.attempts);return z.wrong>=3&&r<.6?['苦手度 高','lv3']:z.wrong>=2&&r<.8?['苦手度 中','lv2']:['苦手度 低','lv1']}function renderDashboard(){let vals=Object.values(stats),attempts=vals.reduce((a,z)=>a+z.attempts,0),correct=vals.reduce((a,z)=>a+z.correct,0);$('totalAttempts').textContent=attempts;$('overallRate').textContent=(attempts?Math.round(correct/attempts*100):0)+'%';$('studiedCount').textContent=vals.length;$('dueCount').textContent=vals.filter(z=>z.next<=Date.now()).length;let list=DATA.filter(x=>stats[key(x)]).sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,30);$('weakList').innerHTML=list.length?list.map(x=>{let z=stats[key(x)],l=level(z),r=Math.round(z.correct/z.attempts*100);return '<div class="wrong-item"><div><b>'+esc(x.en)+'</b><div class="small">'+x.type+' No.'+x.no+'｜'+z.correct+'/'+z.attempts+' 正解</div><div class="bar"><i style="width:'+r+'%"></i></div></div><span class="level '+l[1]+'">'+l[0]+'<br>'+r+'%</span></div>'}).join(''):'<p class="small">まだ学習履歴はありません。</p>';$('examHistory').innerHTML=examHistory.length?examHistory.map(e=>'<div class="wrong-item"><span>'+e.date+'</span><b>'+e.ok+'/'+e.total+'（'+e.rate+'%）</b></div>').join(''):'<p class="small">模試履歴はありません。</p>'}function showTab(t){$('dashboard').classList.toggle('hidden',t!=='dash');$('learnArea').classList.toggle('hidden',t==='dash');$('learnTab').classList.toggle('activeTab',t!=='dash');$('dashTab').classList.toggle('activeTab',t==='dash');if(t==='dash')renderDashboard()}function startTimer(){clearInterval(timerId);remaining=+$('examMinutes').value*60;$('timer').textContent=remaining?fmt(remaining):'制限なし';if(remaining)timerId=setInterval(()=>{remaining--;$('timer').textContent=fmt(remaining);if(remaining<=0){clearInterval(timerId);finish()}},1000)}function fmt(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function resetStats(){if(confirm('正答率・苦手度・復習予定・模試履歴をすべて削除しますか？')){stats={};examHistory=[];save()}}renderWrongs();renderDashboard();</script></body></html>
